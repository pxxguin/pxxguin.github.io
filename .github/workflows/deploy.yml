name: Build, Check, and Deploy Astro Site

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed
  # GitHub Pages 재배포를 수동으로 실행할 수 있도록 추가
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write      # 👈 Pages 배포를 위해 필수 권한 추가
  id-token: write   # 👈 OIDC 인증을 위해 필수 권한 추가

jobs:
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    name: Astro Check for Node.js ${{ matrix.node }}
    steps:
      - name: Setup Node.js
        # 최신 안정 버전의 actions/setup-node 사용을 권장합니다 (v4.3.0)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: npx @biomejs/biome ci ./src

      - name: Run Astro Check
        run: pnpm astro check

  build:
    # 매트릭스를 제거하고 단일 Node 버전(22)으로 배포 빌드를 고정합니다.
    # check Job의 성공 여부와 상관없이 빌드는 진행합니다. (옵션)
    runs-on: ubuntu-latest
    name: Astro Build and Artifact Upload (for deployment)
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 단일 버전으로 고정

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Astro 빌드 실행
      - name: Run Build (Astro + Pagefind)
        run: pnpm build
        
      # 2. GitHub Pages 환경 설정 (배포를 위한 필수 단계)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 빌드된 파일(dist 폴더)을 배포 아티팩트로 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Astro의 기본 출력 폴더

  deploy:
    # build Job이 성공적으로 완료된 후에만 실행
    needs: build
    environment:
      name: github-pages # GitHub Pages 환경 이름
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 4. 업로드된 아티팩트를 Pages 서버에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4