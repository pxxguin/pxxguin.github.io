name: Build, Check, and Deploy Astro Site

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed
  # GitHub Pages 재배포를 수동으로 실행할 수 있도록 추가
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write      # 👈 Pages 배포를 위해 필수 권한 추가
  id-token: write   # 👈 OIDC 인증을 위해 필수 권한 추가

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check for Node.js 22
    steps:
      - name: Setup Node.js
        # 최신 안정 버전의 actions/setup-node 사용을 권장합니다 (v4.3.0)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: npx @biomejs/biome ci ./src

      - name: Run Astro Check
        run: pnpm astro check

  build:
    # 매트릭스를 제거하고 단일 Node 버전(22)으로 배포 빌드를 고정합니다.
    # check Job의 성공 여부와 상관없이 빌드는 진행합니다. (옵션)
    runs-on: ubuntu-latest
    name: Astro Build and Artifact Upload (for deployment)
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 단일 버전으로 고정

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Astro 빌드 실행
      - name: Run Build (Astro + Pagefind)
        run: pnpm build
        
      # 2. GitHub Pages 환경 설정 (배포를 위한 필수 단계)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. 빌드된 파일(dist 폴더)을 배포 아티팩트로 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Astro의 기본 출력 폴더

      # 4. lighthouse/smoke-test job이 재빌드 없이 재사용할 수 있도록 dist를 일반 아티팩트로도 업로드
      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1

  lighthouse:
    # 배포를 막지 않는 비차단 성능 점검. deploy는 build만 기다리고 이 job을 기다리지 않는다.
    needs: build
    runs-on: ubuntu-latest
    name: Lighthouse CI (성능 회귀 점검)
    continue-on-error: true
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          staticDistDir: ./dist
          urls: |
            /index.html
            /archive/index.html
            /about/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  smoke-test:
    # 실제 브라우저로 핵심 페이지의 콘솔/네트워크 에러를 확인 (배포는 막지 않음)
    needs: build
    runs-on: ubuntu-latest
    name: Browser Smoke Test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Serve built site
        run: npx serve -l 4321 ./dist &

      - name: Wait for server
        run: npx wait-on http://localhost:4321

      - name: Run smoke test
        run: node scripts/smoke-check.mjs

  deploy:
    # build Job이 성공적으로 완료된 후에만 실행
    needs: build
    environment:
      name: github-pages # GitHub Pages 환경 이름
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 4. 업로드된 아티팩트를 Pages 서버에 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4